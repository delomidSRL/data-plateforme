server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Regenerated at container start from $API_BASE_URL — must never be cached, otherwise
    # a redeployed container with a new backend URL would still serve the stale value.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
